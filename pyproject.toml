[project]
name = "aill-handle-it"
version = "0.1.0"
description = "Bryllupsnettside for Rikke og Valdemar: personlige invitasjoner, svar og oversikt for brudeparet."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.1,<6.2",
    "whitenoise>=6.12,<6.13",
]

[dependency-groups]
dev = [
    "djlint>=1.50,<1.51",
    "pytest>=9.2,<9.3",
    "pytest-django>=4.14,<4.15",
    "ruff>=0.17,<0.18",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
# WhiteNoise warns «No directory at: …staticfiles» when its middleware starts, because
# only `collectstatic` creates that folder; in tests the files come from `static/`.
# WhiteNoise warns with stacklevel=3, so the warning is attributed to the Django
# module that builds the middleware, and the filter has to name that module.
filterwarnings = ["ignore:No directory at:UserWarning:django.core.handlers.base"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".docs", "_bmad", ".claude", ".logs", "docs", "staticfiles"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, DJ django,
# SIM simplify, C4 comprehensions, PT pytest style, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django: they are formatted, but long help texts and
# class-level lists are Django's own style.
"*/migrations/*" = ["E501", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "wedding", "guests", "dashboard", "tests"]

[tool.djlint]
profile = "django"
extend_exclude = ".docs,_bmad,.claude,.logs,docs,staticfiles"
