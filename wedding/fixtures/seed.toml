# Fictional test data for `uv run manage.py seed_testdata` (FR-68, FR-72, NFR-3, AD-16).
#
# Everyone except Rikke and Valdemar is made up. Emails are on example.com, and
# every phone number starts with "+47 000", which no Norwegian subscriber number
# does. The account number fails the MOD11 check, so no money can reach it.
#
# Story 1.3 loads the settings, the users, the households and the guests.
# Story 2.6d sends the answers, allergies and consents through the send service
# (consent_by must be the household's answered_by). The rest is loaded later:
#   payment reports and payments     -> Story 5.2
#   the withdrawn consent            -> Story 7.2
# The hand-worked results for exactly this data are in expected.toml (FR-69).
#
# Answer fields, per guest (left out when the household has not answered):
#   coming             true or false
#   days               ["fri", "sat", "sun"], consecutive (FR-14)
#   overnight          true or false; the cabin is paid for the whole weekend (FR-16)
#   meals              any of "friday_dinner", "saturday_breakfast", "sunday_breakfast" (FR-73)
#   hike               "yes", "no" or "maybe"; only for people present on Friday (FR-17)
#   no_allergies       true for "Ingen allergier eller matbehov" (FR-25)
#   allergy_categories any of gluten, lactose, nuts, shellfish, vegetarian, vegan, other
#   allergy_note       a short note
#   consent            "yes" or "no"; left out when unanswered (FR-26)
#   consent_by         guest key of the person who gave the consent (FR-29)
#   consent_withdrawn  true when the consent was later withdrawn (FR-30)

[settings]
contact_1_name = "Rikke"
contact_1_phone = "+47 000 00 101"
contact_2_name = "Valdemar"
contact_2_phone = "+47 000 00 102"
# Whole kroner, at the 2026 price level, but not the real prices (AD-12).
price_cabin_weekend = 1500
price_friday_dinner = 340
price_saturday_breakfast = 260
price_sunday_breakfast = 260
# The deadline is set relative to the day the command runs, so the form is open.
deadline_days_from_today = 30
vipps_number = "00000"
account_number = "1234.56.78900"

[[users]]
username = "testpar"
password = "bryllup-test-2028"
role = "couple"

[[users]]
username = "testhjelper"
password = "bryllup-test-2028"
role = "helper"


# UJ-1: Sigmund answers for himself and bestemor. Paid in full, report matches.
[[households]]
key = "sigmund"
answered_by = "sigmund"
payment_report = { amount = 4720, method = "vipps", paid_by = "" }
payments = [{ kind = "received", amount = 4720 }]

[[households.guests]]
key = "sigmund"
name = "Sigmund"
phone = "+47 000 00 111"
email = "sigmund@example.com"
code = "test-sigmund0000000000"
coming = true
days = ["fri", "sat", "sun"]
overnight = true
meals = ["friday_dinner", "saturday_breakfast", "sunday_breakfast"]
hike = "no"
no_allergies = true
consent = "yes"
consent_by = "sigmund"

[[households.guests]]
key = "bestemor"
name = "bestemor"
code = "test-bestemor000000000"
coming = true
days = ["fri", "sat", "sun"]
overnight = true
meals = ["friday_dinner", "saturday_breakfast", "sunday_breakfast"]
hike = "maybe"
allergy_categories = ["gluten"]
consent = "yes"
consent_by = "sigmund"


