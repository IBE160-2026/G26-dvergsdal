<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bildestil, runde 1</title>
<style>
/* ===== BILDESTIL, RUNDE 1 (2026-11-15) =====
   Innspill 06-Vibe: «Stilen på bildene. Koselige, duse, myke, klassiske.» Ingen regel i DESIGN.md sier hvordan bildene skal se ut.
   A = bildene som de er (slik skissene er nå); B = et lett, mykt filter i koden: litt mindre farge og kontrast, litt varmere. */
:root { --green: #5A6C48; --cream: #EBE4D5; --ink: #3B372F; --cream-on-green: #F5EEDF; }
body { margin: 0; background: var(--green); color: var(--ink); font-family: Georgia, serif; font-size: 18px; line-height: 1.5; }
h1 { margin: 0; padding: 24px 24px 4px; color: var(--cream-on-green); font-weight: normal; font-style: italic; font-size: 28px; text-align: center; }
.lead { margin: 0 auto; padding: 0 24px 20px; max-width: 720px; color: var(--cream-on-green); text-align: center; font-size: 19px; }
.cols { display: flex; gap: 24px; justify-content: center; padding: 0 24px 32px; flex-wrap: wrap; }
.sheet { background: var(--cream); border-radius: 5px; box-shadow: 0 2px 6px rgba(20,26,12,.4); padding: 18px 18px 14px; width: 330px; }
.sheet h2 { margin: 0 0 12px; font-weight: normal; font-style: italic; font-size: 24px; text-align: center; }
.row { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.framed { position: relative; width: 300px; aspect-ratio: 932 / 901; }
.framed img.photo { position: absolute; left: 5.2%; top: 5.3%; width: 89.6%; height: 89.4%; object-fit: cover; }
.framed img.lace-frame { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 1px 1.5px rgba(10,14,6,.35)); }
.soft .photo { filter: saturate(.78) contrast(.9) sepia(.14) brightness(1.04); }
.sheet p { margin: 10px 0 0; text-align: center; }
</style>
</head>
<body>
<h1>Bildestil</h1>
<p class="lead">I 06-Vibe likte du at bildene var «koselige, duse, myke, klassiske». Skal bildene av stedet få et lett, mykt preg, eller vises som de er?</p>
<div class="cols">
  <section class="sheet">
    <h2>A · Som de er</h2>
    <div class="row">
      <div class="framed"><img class="photo" src="../../../ux/stedet/18-Kirka.jpg" alt="" style="object-position: 76% 50%"><img class="lace-frame" src="../mockups/blonde.png" alt=""></div>
      <div class="framed"><img class="photo" src="../../../ux/stedet/03-Venue.jpg" alt="" style="object-position: 50% 82%"><img class="lace-frame" src="../mockups/blonde.png" alt=""></div>
      <div class="framed"><img class="photo" src="../../../ux/stedet/12-Area.jpg" alt=""><img class="lace-frame" src="../mockups/blonde.png" alt=""></div>
    </div>
    <p>Klare farger, slik bildene er tatt.</p>
  </section>
  <section class="sheet soft">
    <h2>B · Mykere</h2>
    <div class="row">
      <div class="framed"><img class="photo" src="../../../ux/stedet/18-Kirka.jpg" alt="" style="object-position: 76% 50%"><img class="lace-frame" src="../mockups/blonde.png" alt=""></div>
      <div class="framed"><img class="photo" src="../../../ux/stedet/03-Venue.jpg" alt="" style="object-position: 50% 82%"><img class="lace-frame" src="../mockups/blonde.png" alt=""></div>
      <div class="framed"><img class="photo" src="../../../ux/stedet/12-Area.jpg" alt=""><img class="lace-frame" src="../mockups/blonde.png" alt=""></div>
    </div>
    <p>Litt mindre farge og kontrast, litt varmere. Samme filter på alle bildene.</p>
  </section>
</div>
</body>
</html>
